# review.aigalaxy.top — nginx reverse proxy for the local production review server.
#
# The backend is the BUILT Cloudflare Worker served locally on 127.0.0.1:3100
# (see scripts/serve-prod.sh: npm run build && npm run prod:start).
#
# Install:
#   1. DNS: create an A record for review.aigalaxy.top pointing at this box's public
#      IP BEFORE running certbot — the HTTP-01 challenge must reach this server.
#   2. sudo cp deploy/nginx/review.aigalaxy.top.conf /etc/nginx/sites-available/
#   3. sudo ln -s /etc/nginx/sites-available/review.aigalaxy.top.conf /etc/nginx/sites-enabled/
#   4. sudo mkdir -p /var/www/certbot
#   5. sudo certbot --nginx -d review.aigalaxy.top
#   6. sudo nginx -t && sudo systemctl reload nginx

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name review.aigalaxy.top;

    # Let's Encrypt HTTP-01 challenge.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name review.aigalaxy.top;

    ssl_certificate     /etc/letsencrypt/live/review.aigalaxy.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/review.aigalaxy.top/privkey.pem;

    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 10m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/rss+xml
        image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;

        # WebSocket / streaming upgrades.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
